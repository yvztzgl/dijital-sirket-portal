@let v = vals();
<aside class="card" [class.arriving]="v.phase !== 'done'" [class.thinking]="v.phase === 'thinking'" aria-label="Terminal AI önerisi">
  <app-bot class="avatar" size="46px" [mood]="v.phase === 'thinking' || v.busy ? 'thinking' : 'idle'" />
  <div class="body">
    <span class="label">TERMİNAL AI ÖNERİSİ @if (v.phase === 'thinking') {<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>}</span>
    <!-- Screen readers get the whole message at once; the written-out copy is for the eye. -->
    <span class="sr" aria-live="polite">{{ v.title }}. {{ v.reason }}</span>
    <span class="title" aria-hidden="true">{{ v.typed }}@if (v.phase === 'typing') {<span class="caret"></span>}<span class="rest">{{ v.rest }}</span></span>
    <span class="reason" aria-hidden="true">{{ v.reason }}</span>
    <div class="chips">
      <button type="button" class="chip" [disabled]="v.busy" (click)="why()">Neden?</button>
      @for (c of v.chips; track c) {<button type="button" class="chip" [disabled]="v.busy" (click)="ask(c)">{{ c }}</button>}
      <button type="button" class="chip own" (click)="assistant.compose.update(n => n + 1)"><app-icon name="pencil" size="13px" [stroke]="2" />Kendi sorunuzu yazın</button>
    </div>
  </div>
</aside>
