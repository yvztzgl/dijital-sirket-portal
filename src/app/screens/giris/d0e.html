<div data-screen-label="D-0e Yeni şifre" style="width:100%;min-height:100vh;background:var(--bg-F4F6FB);overflow:clip">
      <app-top-bar [guest]="true" guestMode="login"></app-top-bar>
      <div style="padding:80px 80px 96px;display:flex;justify-content:center">
        <div style="width:520px;background:var(--bg-FFFFFF);border:1px solid var(--bd-E5E7EB);border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:22px">
          <div style="display:flex;flex-direction:column;gap:6px"><h3 style="margin:0;font:600 24px/32px 'IBM Plex Sans',sans-serif;color:var(--fg-061262)">Yeni şifrenizi belirleyin</h3><span style="font:400 15px/22px 'IBM Plex Sans',sans-serif;color:var(--fg-3B4660);text-wrap:pretty">Şifreniz değiştiğinde açık olan tüm oturumlarınız kapatılır.</span></div>
          @if (token) {
            <div style="display:flex;flex-direction:column;gap:8px">
              <label for="np-pw" style="font:500 13.5px/18px 'IBM Plex Sans',sans-serif;color:var(--fg-1F2A44)">Yeni şifre</label>
              <div style="display:flex;height:46px;box-sizing:border-box;border:1px solid var(--bd-D6DEEE);border-radius:9px;overflow:hidden">
                <input id="np-pw" [type]="vals().pwType" [value]="form().password" (input)="setField('password', $event)" autocomplete="new-password" placeholder="En az 10 karakter" style="flex:1;min-width:0;border:0;outline:0;padding:0 14px;font:500 15.5px/20px 'IBM Plex Sans',sans-serif;color:var(--fg-061262);background:transparent">
                <button type="button" (click)="vals().togglePw()" [attr.aria-pressed]="vals().showPw" [attr.aria-label]="vals().showPw ? 'Şifreyi gizle' : 'Şifreyi göster'" [title]="vals().showPw ? 'Şifreyi gizle' : 'Şifreyi göster'" class="pw-eye" style="flex:none;width:36px;height:36px;margin-right:4px;align-self:center;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--fg-5B6478);cursor:pointer">@if (vals().showPw) {<app-icon name="eye-off" size="18px" [stroke]="1.8" />} @else {<app-icon name="eye" size="18px" [stroke]="1.8" />}</button>
              </div>
              <div aria-hidden="true" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px">@for (c of vals().strengthBars; track $index) {<span [attr.style]="`height:4px;border-radius:2px;background:${c}`"></span>}</div>
              <span aria-live="polite" [attr.style]="`font:400 12.5px/18px 'IBM Plex Sans',sans-serif;color:${vals().strengthColor}`"><app-itext [text]="vals().strengthText" /></span>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <label for="np-repeat" style="font:500 13.5px/18px 'IBM Plex Sans',sans-serif;color:var(--fg-1F2A44)">Yeni şifre (tekrar)</label>
              <input id="np-repeat" [type]="vals().pwType" [value]="form().repeat" (input)="setField('repeat', $event)" (keydown.enter)="setNewPassword(token)" autocomplete="new-password" style="height:46px;box-sizing:border-box;border:1px solid var(--bd-D6DEEE);border-radius:9px;padding:0 14px;font:500 15.5px/20px 'IBM Plex Sans',sans-serif;color:var(--fg-061262);outline:0">
            </div>
            <app-form-error [message]="tried() && formError() ? formError() : null" />
            <button type="button" (click)="setNewPassword(token)" [disabled]="store.busy()" style="border:0;background:var(--bg-061262);color:var(--fg-FFFFFF);border-radius:10px;padding:14px 22px;font:600 15px/20px 'IBM Plex Sans',sans-serif;cursor:pointer"><app-itext [text]="store.busy() ? 'Kaydediliyor…' : 'Şifremi değiştir'" /></button>
          } @else {
            <app-form-error message="Bağlantı geçersiz veya eksik. Yeniden şifre sıfırlama isteyiniz." />
          }
          <div style="display:flex;justify-content:space-between;gap:12px;font:500 13px/18px 'IBM Plex Sans',sans-serif"><a routerLink="/reset-password">Yeni bağlantı iste</a><a routerLink="/login"><app-icon name="arrow-left" /> Girişe dön</a></div>
        </div>
      </div>
    </div>
