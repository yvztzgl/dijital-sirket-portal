<div data-screen-label="D-0d Şifre sıfırlama" style="width:100%;min-height:100vh;background:var(--bg-F4F6FB);overflow:clip">
      <app-top-bar [guest]="true" guestMode="login"></app-top-bar>
      <div style="padding:80px 80px 96px;display:flex;justify-content:center">
        <div style="width:520px;background:var(--bg-FFFFFF);border:1px solid var(--bd-E5E7EB);border-radius:16px;box-shadow:0 12px 32px -16px rgba(6,18,98,.22);padding:40px;display:flex;flex-direction:column;gap:22px">
          <div style="display:flex;flex-direction:column;gap:6px"><h3 style="margin:0;font:600 24px/32px 'IBM Plex Sans',sans-serif;color:var(--fg-061262)">Şifrenizi sıfırlayın</h3><span style="font:400 15px/22px 'IBM Plex Sans',sans-serif;color:var(--fg-3B4660)">Kayıtlı e-posta adresinizi girin; size bir sıfırlama bağlantısı gönderelim.</span></div>
          <div style="display:flex;flex-direction:column;gap:8px"><label style="font:500 13.5px/18px 'IBM Plex Sans',sans-serif;color:var(--fg-1F2A44)">E-posta</label><input type="email" [value]="form().email" (input)="setField('email', $event)" (keydown.enter)="requestReset()" autocomplete="email" placeholder="ornek@sirket.com" style="height:46px;box-sizing:border-box;border:1px solid var(--bd-D6DEEE);border-radius:9px;padding:0 14px;font:500 15.5px/20px 'IBM Plex Sans',sans-serif;color:var(--fg-061262);outline:0"></div>
          <app-form-error [message]="tried() && formError() ? formError() : null" />
          @if (resetSent()) {<div role="status" style="display:flex;gap:12px;padding:14px 16px;border-radius:10px;background:var(--bg-F7FCF8);border:1px solid var(--bd-DCEFE2)"><span aria-hidden="true" style="width:22px;height:22px;flex:none;border-radius:50%;background:var(--bg-15803D);color:var(--fg-FFFFFF);display:grid;place-items:center;font:700 11px/1 'IBM Plex Sans',sans-serif"><app-icon name="check" /></span><span style="font:400 13.5px/20px 'IBM Plex Sans',sans-serif;color:var(--fg-14532D);text-wrap:pretty">Bu adres kayıtlıysa birkaç dakika içinde bir sıfırlama bağlantısı alacaksınız. Bağlantı 30 dakika geçerlidir.</span></div>}
          <div style="display:flex;gap:12px"><button type="button" (click)="requestReset()" [disabled]="store.busy() || (resetSent() && resendIn() > 0)" style="flex:1;border:1px solid var(--bd-D6DEEE);background:var(--bg-FFFFFF);color:var(--fg-061262);border-radius:10px;padding:13px 20px;font:600 15px/20px 'IBM Plex Sans',sans-serif;cursor:pointer">{{ store.busy() ? 'Gönderiliyor…' : !resetSent() ? 'Bağlantı gönder' : resendIn() > 0 ? 'Tekrar gönder · ' + resendLabel() : 'Tekrar gönder' }}</button><a class="ui-btn ui-btn--primary" routerLink="/login" style="flex:1;display:grid;place-items:center;border-radius:10px;background:var(--bg-061262);color:var(--fg-FFFFFF);padding:13px 20px;font:600 15px/20px 'IBM Plex Sans',sans-serif;text-decoration:none"><app-icon name="arrow-left" /> Girişe dön</a></div>
        </div>
      </div>
    </div>
